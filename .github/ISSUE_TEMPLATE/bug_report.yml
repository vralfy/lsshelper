name: Bug report
description: Report a bug to help us improve
title: "fix: <short description>"
labels: ["type:bug", "status:triage"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us what you expected to happen.
      placeholder: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: 1) … 2) … 3) …
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: OS, browser/node version, app version/commit
  - type: textarea
    id: extra
    attributes:
      label: Additional context
